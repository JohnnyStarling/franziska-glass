<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc"><title id="title">Franziska system architecture</title><desc id="desc">Telegram and Control UI reach the main agent. Glass connects to Pixel by Wi-Fi; Pixel reaches the OpenClaw realtime relay by WebSocket. The realtime provider consults the main agent through that relay. Memory and tools remain on the agent host. Navigation uses a separate phone-to-Glass Bluetooth route.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#111" stroke-width="1.4"/></marker></defs><rect width="1440" height="1060" fill="#fff"/><g font-family="Helvetica,Arial,sans-serif" fill="#111"><text x="64" y="68" font-size="34" font-weight="700">SYSTEM ARCHITECTURE</text><text x="64" y="106" font-size="20" fill="#555">Ownership, interfaces and principal data paths.</text><rect x="64" y="360" width="960" height="470" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="88" y="806" font-size="20" font-family="Courier New,monospace">MAC / OPENCLAW HOST</text><path d="M270 280V440" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="286" y="332" font-size="17" fill="#444">text / agent tasks</text><path d="M840 215H980" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="877" y="197" font-size="17" fill="#444">Wi-Fi</text><path d="M1160 280V320H810V440" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="866" y="345" font-size="17" fill="#444">WSS / realtime + chat</text><path d="M540 505H640" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="548" y="486" font-size="14" fill="#444">task / result</text><path d="M320 570V660" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="338" y="625" font-size="17" fill="#444">recall / writeback</text><path d="M540 546H580V715H640" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="584" y="700" font-size="14" fill="#444">execute</text><path d="M980 505H1080" fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="1012" y="485" font-size="17" fill="#444">live</text><rect x="100" y="150" width="340" height="130" fill="#fff" stroke="#111" stroke-width="2"/><text x="124" y="189" font-size="24" font-weight="700">TELEGRAM / CONTROL UI</text><text x="124" y="223" font-size="19" fill="#444">Text, documents, interaction</text><text x="124" y="249" font-size="19" fill="#444">with the main agent</text><rect x="560" y="150" width="280" height="130" fill="#fff" stroke="#111" stroke-width="2"/><text x="584" y="189" font-size="24" font-weight="700">GOOGLE GLASS</text><text x="584" y="223" font-size="19" fill="#444">Voice + display</text><text x="584" y="249" font-size="19" fill="#444">Wearable interface</text><rect x="980" y="150" width="360" height="130" fill="#fff" stroke="#111" stroke-width="2"/><text x="1004" y="189" font-size="24" font-weight="700">PIXEL 7</text><text x="1004" y="223" font-size="19" fill="#444">Companion, connectivity</text><text x="1004" y="249" font-size="19" fill="#444">and media bridge</text><rect x="100" y="440" width="440" height="130" fill="#fff" stroke="#111" stroke-width="2"/><text x="124" y="479" font-size="24" font-weight="700">MAIN AGENT</text><text x="124" y="513" font-size="19" fill="#444">Reasoning + authorized tools</text><text x="124" y="539" font-size="19" fill="#444">Durable conversation + task ownership</text><rect x="640" y="440" width="340" height="130" fill="#fff" stroke="#111" stroke-width="2"/><text x="664" y="479" font-size="24" font-weight="700">REALTIME RELAY</text><text x="664" y="513" font-size="19" fill="#444">Voice-session coordination</text><text x="664" y="539" font-size="19" fill="#444">Agent consultation + results</text><rect x="100" y="660" width="440" height="116" fill="#fff" stroke="#111" stroke-width="2"/><text x="124" y="699" font-size="24" font-weight="700">CONTINUITY / MEMORY</text><text x="124" y="733" font-size="19" fill="#444">Archives, project records, retrieval</text><rect x="640" y="660" width="340" height="116" fill="#fff" stroke="#111" stroke-width="2"/><text x="664" y="699" font-size="24" font-weight="700">TOOLS / SERVICES</text><text x="664" y="733" font-size="19" fill="#444">Files, software, connected APIs</text><rect x="1080" y="440" width="300" height="170" fill="#fff" stroke="#111" stroke-width="2"/><text x="1104" y="479" font-size="24" font-weight="700">REALTIME PROVIDER</text><text x="1104" y="513" font-size="19" fill="#444">Speech interaction</text><text x="1104" y="539" font-size="19" fill="#444">and streaming audio</text><text x="1104" y="565" font-size="19" fill="#444">through the relay</text><path d="M64 902H1376" fill="none" stroke="#111" stroke-width="2"/><text x="64" y="944" font-size="22" font-weight="700">SEPARATE NAVIGATION PATH</text><text x="64" y="983" font-size="21">Pixel / OsmAnd → Bluetooth → Glass / OsmGlass</text><text x="64" y="1020" font-size="18" fill="#555">Phone-side routing and maps. No Mac or OpenClaw required for navigation.</text></g></svg>
