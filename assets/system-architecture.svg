<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc"><title id="title">Franziska: runtime, model backends and interfaces</title><desc id="desc">The Mac hosts the OpenClaw agent runtime, realtime relay, conversation state, continuity and tool adapters. Separate model backends supply reasoning and realtime speech inference. Tool adapters connect to external services. Glass reaches the Gateway through Pixel. Navigation is an independent phone-to-Glass Bluetooth path.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#111" stroke-width="1.4"/></marker></defs><rect width="720" height="1280" fill="#fff"/><g font-family="Helvetica,Arial,sans-serif" fill="#111"><text x="40" y="56" font-size="30" font-weight="700">SYSTEM / OWNERSHIP</text><text x="40" y="92" font-size="22" fill="#555">Runtime and inference are separate components.</text><rect x="40" y="300" width="640" height="300" fill="#f5f5f5" stroke="#111" stroke-width="2"/><path d="M360 220V300" fill="none" stroke="#111" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="380" y="270" font-size="22" fill="#444">requests / results</text><path d="M70 445H20V665H190V710" fill="none" stroke="#111" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M650 445H700V665H530V710" fill="none" stroke="#111" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M360 600V920" fill="none" stroke="#111" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="380" y="885" font-size="22" fill="#444">tool dispatch</text><rect x="40" y="120" width="640" height="100" fill="#fff" stroke="#111" stroke-width="2"/><text x="64" y="160" font-size="27" font-weight="700">USER INTERFACES</text><text x="64" y="198" font-size="23" fill="#444">Telegram · Control UI · Glass via Pixel</text><text x="64" y="344" font-size="25" font-family="Courier New,monospace">MAC / OPENCLAW RUNTIME</text><rect x="70" y="380" width="270" height="130" fill="#fff" stroke="#111" stroke-width="2"/><text x="94" y="420" font-size="26" font-weight="700">MAIN AGENT</text><text x="94" y="458" font-size="23" fill="#444">Context + tasks</text><text x="94" y="487" font-size="23" fill="#444">Tool orchestration</text><rect x="380" y="380" width="270" height="130" fill="#fff" stroke="#111" stroke-width="2"/><text x="404" y="420" font-size="26" font-weight="700">VOICE RELAY</text><text x="404" y="458" font-size="23" fill="#444">Live interaction</text><text x="404" y="487" font-size="23" fill="#444">Agent consultation</text><text x="64" y="557" font-size="23" fill="#444">Session state · Memory · Tool adapters</text><rect x="40" y="710" width="300" height="140" fill="#fff" stroke="#111" stroke-width="2"/><text x="64" y="750" font-size="25" font-weight="700">REASONING MODEL</text><text x="64" y="788" font-size="23" fill="#444">Selected backend</text><text x="64" y="817" font-size="23" fill="#444">Provider API or local</text><rect x="380" y="710" width="300" height="140" fill="#fff" stroke="#111" stroke-width="2"/><text x="404" y="750" font-size="25" font-weight="700">REALTIME MODEL</text><text x="404" y="788" font-size="23" fill="#444">Speech interaction</text><text x="404" y="817" font-size="23" fill="#444">Streaming audio</text><rect x="40" y="920" width="640" height="120" fill="#fff" stroke="#111" stroke-width="2"/><text x="64" y="960" font-size="27" font-weight="700">CONNECTED SERVICES</text><text x="64" y="998" font-size="23" fill="#444">External APIs and device/tool endpoints</text><path d="M40 1100H680" fill="none" stroke="#111" stroke-width="2"/><text x="40" y="1144" font-size="28" font-weight="700">SEPARATE NAVIGATION</text><text x="40" y="1187" font-size="25">Pixel / OsmAnd → Bluetooth → Glass</text><text x="40" y="1229" font-size="22" fill="#555">Phone-side maps and routing. No Mac required.</text></g></svg>
